server:
  port: 8080

spring:
  application:
    name: pelsmasher-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/pelsmasher}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:pelsmasher}
    password: ${SPRING_DATASOURCE_PASSWORD:pelsmasher}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

app:
  cors:
    allowed-origins:
      - http://127.0.0.1:5173
      - http://localhost:5173
