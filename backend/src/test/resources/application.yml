spring:
  datasource:
    url: jdbc:h2:mem:pelsmasher-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

app:
  cors:
    allowed-origins:
      - http://127.0.0.1:5173
