services:
  postgres:
    image: postgres:16-alpine
    container_name: pelsmasher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pelsmasher
      POSTGRES_USER: pelsmasher
      POSTGRES_PASSWORD: pelsmasher
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
